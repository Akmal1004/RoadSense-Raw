name: RoadSense Enterprise Automation CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  appium-python-tests:
    name: Appium Python Mobile Automation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Appium Python Dependencies
        run: |
          cd RoadSense-Automation/Appium-Python
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Appium Pytest Suite (Collect Only Dry Run)
        run: |
          cd RoadSense-Automation/Appium-Python
          pytest --collect-only

  selenium-nodejs-tests:
    name: Selenium Node.js Web Automation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Selenium Node Dependencies
        run: |
          cd RoadSense-Automation/Selenium-NodeJS
          npm ci

      - name: Run Selenium Mocha Suite Dry Run
        run: |
          cd RoadSense-Automation/Selenium-NodeJS
          npm test
