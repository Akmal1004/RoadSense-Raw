name: RoadSense Enterprise Automation CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  appium-python-tests:
    name: Appium Python Mobile Automation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Appium Python Dependencies
        run: |
          cd RoadSense-Automation/Appium-Python
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install openpyxl jinja2 requests

      - name: Run Appium Pytest Suite (Collect Only Dry Run)
        run: |
          cd RoadSense-Automation/Appium-Python
          pytest --collect-only

  selenium-nodejs-tests:
    name: Selenium Node.js Web Automation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Selenium Node Dependencies
        run: |
          cd RoadSense-Automation/Selenium-NodeJS
          npm ci

      - name: Run Selenium Mocha Suite Dry Run
        run: |
          cd RoadSense-Automation/Selenium-NodeJS
          npm test

  generate-excel-report-300-tests:
    name: Generate & Upload 300+ Test Cases Excel Sheet Report
    runs-on: ubuntu-latest
    needs: [appium-python-tests, selenium-nodejs-tests]
    if: always()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Report Generator Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl jinja2 requests pytest

      - name: Generate 300+ Test Cases Excel Workbooks
        run: |
          python automation/utils/generate_excel_report_300.py

      - name: Upload 300+ Test Cases Excel Sheet Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoadSense-Excel-Report-300-Test-Cases
          path: |
            Test Results/Excel/
            Test Results/Summary/
            Test Results/JSON/
            Test Results/HTML/
          retention-days: 30

      - name: Publish Action Execution Step Summary
        run: |
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          fi
