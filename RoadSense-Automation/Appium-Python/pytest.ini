[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = 
    -v
    -s
    --tb=short
    --reruns 1
    --reruns-delay 2
    --html=reports/html_report.html
    --self-contained-html
    --alluredir=reports/allure-results

markers =
    smoke: Critical path smoke tests
    sanity: Build verification sanity tests
    regression: Comprehensive regression suite
    auth: Authentication and authorization tests
    navigation: Maps and routing tests
    security: Security, RBAC, and vulnerability tests
    performance: Stress and performance metrics tests
    api: API integration and schema tests
